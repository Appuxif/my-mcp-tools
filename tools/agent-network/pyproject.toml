[project]
name = "agent-network"
version = "0.1.0"
description = "Persistent multi-agent messaging over native MCP with optional wake adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.0,<3.0",
  "websockets>=14",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_network*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
